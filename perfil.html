<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário - ViajaFácil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">😒ViajaDifícil</div>
            <ul id="menu" class="menu">
                <li><a href="index.html">Destinos</a></li>
                <li><a href="index.html">Simulador</a></li>
                <li><a href="perfil.html">Perfil</a></li>
            </ul>
            <button id="btn-tema">🌙 Escuro</button>
        </nav>
    </header>

    <main class="container">
        <section class="profile">
            <img src="perfil.jpeg" alt="Foto do Usuário" class="profile-img">
            <div class="profile-info">
                <h2>Nome do Usuário</h2>
                <p>Uma breve biografia sobre o usuário que destaca seus interesses e hobbies.</p>
            </div>
        </section>

        <section class="simulador-box" style="margin-top: 2rem;">
            <div class="contact">
                <h3>Contato</h3>
                <p>Email: usuario@email.com</p>
            </div>
            <div class="social-media" style="margin-top: 1.5rem;">
                <h3>Redes Sociais</h3>
                <p>Twitter: @usuario</p>
            </div>
        </section>
    </main>

    <footer style="text-align: center; margin-top: 2rem;">
        <button class="action-btn" onclick="window.location.href='index.html'">Voltar para o Início</button>
    </footer>
    <script src="script.js"></script>
</body>
</html>
